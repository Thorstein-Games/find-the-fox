name: Deploy to GitHub Pages

# Deploys whatever is on the repository's default branch (main, once it
# exists). Run it by hand from the Actions tab too.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Tells us where Pages serves the site: "/find-the-fox" on
      # thorstein-games.github.io, "" once a custom domain is configured.
      - id: pages
        uses: actions/configure-pages@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Optional repo variable; defaults to wss://megingjord.onrender.com
          NEXT_PUBLIC_GAME_SERVER_URL: ${{ vars.GAME_SERVER_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
